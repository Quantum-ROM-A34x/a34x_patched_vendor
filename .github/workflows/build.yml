name: Build Unified Multi-Variant ROM Stack

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Main Repository
        uses: actions/checkout@v4

      - name: Free Maximum Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lz4 android-sdk-libsparse-utils erofs-utils p7zip-full attr

      - name: Install Rust Samloader & lpunpack
        run: |
          wget -q https://github.com/topjohnwu/samloader-rs/releases/download/2.0.0/samloader-v2.0.0-linux-x86_64.tar.xz
          tar -xf samloader-v2.0.0-linux-x86_64.tar.xz
          sudo mv samloader /usr/local/bin/samloader
          sudo chmod +x /usr/local/bin/samloader
          
          wget -q https://raw.githubusercontent.com/unix3dgforce/lpunpack/master/lpunpack.py
          sudo mv lpunpack.py /usr/local/bin/lpunpack.py

      - name: Retrieve and Decrypt Firmware
        run: |
          for i in {1..3}; do
            if samloader download -m SM-A346E -r INS -o decrypted_firmware.zip; then
              break
            fi
            sleep 20
          done

      - name: Extract Core Partitions & Super Image
        run: |
          unzip -q decrypted_firmware.zip "AP_*.tar.md5" "BL_*.tar.md5"
          rm decrypted_firmware.zip
          
          tar -xf AP_*.tar.md5 super.img.lz4 init_boot.img.lz4 dtbo.img.lz4 vendor_boot.img.lz4 boot.img.lz4 vbmeta_system.img.lz4 vbmeta_vendor.img.lz4 || true
          tar -xf BL_*.tar.md5 vbmeta.img.lz4 || true
          rm *.tar.md5
          
          lz4 -d super.img.lz4 super.img
          rm super.img.lz4
          
          for img in boot init_boot vendor_boot dtbo vbmeta vbmeta_system vbmeta_vendor; do
            if [ -f "${img}.img.lz4" ]; then
              lz4 -d "${img}.img.lz4" "${img}.img"
              rm "${img}.img.lz4"
            fi
          done
          
          if file super.img | grep -q "sparse"; then
            simg2img super.img super_raw.img
            rm super.img 
          else
            mv super.img super_raw.img
          fi

      - name: Unpack & Isolate Untouched Logical Partitions
        run: |
          mkdir extracted_super
          python3 /usr/local/bin/lpunpack.py -p vendor super_raw.img extracted_super
          python3 /usr/local/bin/lpunpack.py -p vendor_dlkm super_raw.img extracted_super
          python3 /usr/local/bin/lpunpack.py -p odm super_raw.img extracted_super
          python3 /usr/local/bin/lpunpack.py -p system_dlkm super_raw.img extracted_super || true
          python3 /usr/local/bin/lpunpack.py -p odm_dlkm super_raw.img extracted_super || true
          
          rm super_raw.img
          
          for part in vendor vendor_dlkm odm system_dlkm odm_dlkm; do
            if [ -f "extracted_super/${part}.img" ]; then
              if file "extracted_super/${part}.img" | grep -q "sparse"; then
                simg2img "extracted_super/${part}.img" "${part}_raw.img"
              else
                mv "extracted_super/${part}.img" "${part}_raw.img"
              fi
            fi
          done
          
          [ -f vendor_dlkm_raw.img ] && mv vendor_dlkm_raw.img vendor_dlkm.img
          [ -f odm_raw.img ] && mv odm_raw.img odm.img
          [ -f system_dlkm_raw.img ] && mv system_dlkm_raw.img system_dlkm.img
          [ -f odm_dlkm_raw.img ] && mv odm_dlkm_raw.img odm_dlkm.img || true

      - name: Patch VBMeta
        run: |
          cat << 'EOF' > patch_vbmeta.py
          import sys, os
          for path in sys.argv[1:]:
              if os.path.exists(path):
                  with open(path, 'rb+') as f:
                      f.seek(120)
                      f.write(b'\x03\x00\x00\x00')
          EOF
          python3 patch_vbmeta.py vbmeta.img vbmeta_system.img vbmeta_vendor.img
          
          [ -f vbmeta.img ] && tar -cvf vbmeta_disabled.tar vbmeta.img

      - name: Build Unified Patched Vendor Image
        run: |
          mkdir vendor_mount vendor_tree
          sudo mount -o ro vendor_raw.img vendor_mount
          
          sudo find vendor_mount | sudo xargs -I "{}" -P "$(nproc)" sh -c 'echo "$1 $(getfattr -n security.selinux --only-values -h --absolute-names "$1" 2>/dev/null || echo "u:object_r:vendor_file:s0")"' sh "{}" > file_context.txt
          
          sudo cp -a -T vendor_mount/ vendor_tree/
          sudo umount vendor_mount

          sed -i 's|vendor_mount|/vendor|g' file_context.txt
          sed -i -e "s|\.|\\\.|g" -e "s|\+|\\\+|g" -e "s|\[|\\\[|g" -e "s|\]|\\\]|g" -e "s|\*|\\\*|g" file_context.txt

          sudo rm -rf vendor_tree/tee
          sudo mkdir -p vendor_tree/tee

          git clone https://github.com/UN1CA/target_a34x_patches_tee un1ca_tee
          sudo cp -a un1ca_tee/vendor/tee_* vendor_tree/

          sudo mkdir -p vendor_tree/etc/init
          cat << 'EOF' | sudo tee vendor_tree/etc/init/tee_blobs.rc
          on early-fs && property:ro.boot.em.model=SM-A346E
              mount none /vendor/tee_sea /vendor/tee bind
          on early-fs && property:ro.boot.em.model=SM-A346B
              mount none /vendor/tee_eea /vendor/tee bind
          on early-fs && property:ro.boot.em.model=SM-A346M
              mount none /vendor/tee_latam /vendor/tee bind
          on early-fs && property:ro.boot.em.model=SM-A3460
              mount none /vendor/tee_chn /vendor/tee bind
          on early-fs && property:ro.boot.em.model=SM-A346N
              mount none /vendor/tee_kor /vendor/tee bind
          EOF

          sudo find vendor_tree/ -type f -name "recovery-from-boot.p" -delete
          sudo find vendor_tree/ -type f -name "*recovery*boot.p" -delete
          sudo find vendor_tree/ -type f -name "install-recovery.sh" -delete

          echo "/vendor/tee_[a-z_]+(/.*)? u:object_r:tee_file:s0" >> file_context.txt
          echo "/vendor/etc/init/tee_blobs\.rc u:object_r:vendor_init_rc_file:s0" >> file_context.txt
          sort -u -o file_context.txt file_context.txt

          sudo find vendor_tree/ -maxdepth 1 -type d -name "tee_*" -exec chmod 755 {} \;
          sudo find vendor_tree/tee_* -type d -exec sudo chmod 755 {} +
          sudo find vendor_tree/tee_* -type f -exec sudo chmod 644 {} +
          sudo chmod 644 vendor_tree/etc/init/tee_blobs.rc

          CIL_FILE="vendor_tree/etc/selinux/vendor_sepolicy.cil"
          if [ -f "$CIL_FILE" ] && ! sudo grep -q "tee_file (dir (mounton" "$CIL_FILE"; then
              INIT_TYPE=$(grep -oE '\(typeattributeset init_[a-zA-Z0-9_]*' "$CIL_FILE" | head -n 1 | awk '{print $2}')
              PRIV_TYPE=$(grep -oE '\(typeattributeset priv_app_[a-zA-Z0-9_]*' "$CIL_FILE" | head -n 1 | awk '{print $2}')
              [ -z "$INIT_TYPE" ] && INIT_TYPE="init"
              [ -z "$PRIV_TYPE" ] && PRIV_TYPE="priv_app"
              sudo bash -c "echo '(allow $INIT_TYPE tee_file (dir (mounton)))' >> $CIL_FILE"
              sudo bash -c "echo '(allow $PRIV_TYPE tee_file (dir (getattr)))' >> $CIL_FILE"
          fi

          PROP_FILE="vendor_tree/etc/build.prop"
          [ ! -f "$PROP_FILE" ] && PROP_FILE="vendor_tree/build.prop"
          
          SUPPORTED_BL=$(cat un1ca_tee/supported_bootloaders | tr '\n' ',' | sed 's/,$//')
          TEE_VER=$(grep 'version=' un1ca_tee/module.prop | sed 's/version=//')
          
          sudo bash -c "echo 'ro.vendor.multitee.supported_bootloaders=$SUPPORTED_BL' >> $PROP_FILE"
          sudo bash -c "echo 'ro.vendor.multitee.version=$TEE_VER' >> $PROP_FILE"
          
          sudo sed -i 's/fileencryption=[^,]*//g' vendor_tree/etc/fstab.* 2>/dev/null || true
          sudo sed -i 's/metadata_encryption=[^,]*//g' vendor_tree/etc/fstab.* 2>/dev/null || true

      - name: Rebuild Partition Images
        run: |
          sudo mkfs.erofs -z "lz4hc,9" -b 4096 --mount-point "/vendor" --file-contexts file_context.txt vendor.img vendor_tree/

      - name: Publish to Unified GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "A34_ONEUI8_UNIFIED_${{ github.run_id }}"
          name: "Galaxy A34 Unified Stack (Build ${{ github.run_id }})"
          fail_on_unmatched_files: false
          files: |
            vendor.img
            vendor_dlkm.img
            system_dlkm.img
            odm.img
            odm_dlkm.img
            boot.img
            init_boot.img
            vendor_boot.img
            dtbo.img
            vbmeta_disabled.tar
          draft: false
          prerelease: false
